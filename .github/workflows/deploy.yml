name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # BUILD VAULT
      - name: Clone Quartz
        run: |
          git clone --branch v4.5.2 --depth 1 https://github.com/jackyzha0/quartz.git quartz-build
          cd quartz-build
          npm ci

      - name: Setup Vault
        run: |
          rm -rf quartz-build/content/*
          cp -r content-library/* quartz-build/content/
          cp quartz-library/quartz.config.ts quartz-build/quartz.config.ts
          cp quartz-library/quartz.layout.ts quartz-build/quartz.layout.ts

          if [ -d "quartz-library/custom" ]; then
            cp quartz-library/custom/*.tsx quartz-build/quartz/components/ || true
            if [ -f "quartz-library/custom/BookHeader.tsx" ]; then
              echo 'import BookHeader from "./BookHeader"' >> quartz-build/quartz/components/index.ts
              sed -i 's/export {/export { BookHeader,/' quartz-build/quartz/components/index.ts
            fi
            if [ -f "quartz-library/custom/SiteNav.tsx" ]; then
              echo 'import SiteNav from "./SiteNav"' >> quartz-build/quartz/components/index.ts
              sed -i 's/export {/export { SiteNav,/' quartz-build/quartz/components/index.ts
            fi
          fi

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png quartz-build/quartz/static/icon.png
          fi

      - name: Build
        run: |
          cd quartz-build
          npx quartz build

      - name: Prepare deployment directory
        run: mv quartz-build/public public

      - name: Inject redirect stubs
        run: |
          cp redirects/portfolio.html public/portfolio.html
          cp redirects/blog.html public/blog.html
          mkdir -p public/library
          cp redirects/library/index.html public/library/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
